# ============================================
# Fly.io Configuration for URL Shortener API
# ============================================
# Deploy with: fly deploy
# Docs: https://fly.io/docs/reference/configuration/

app = "url-short-sebas-api"
primary_region = "mia"  # Miami - cercano a Latinoamérica

[build]
  dockerfile = "Dockerfile.alpine"  # Usar Alpine para tener healthchecks

[env]
  PORT = "8080"
  GIN_MODE = "release"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "5s"
  interval = "30s"
  method = "GET"
  path = "/health"
  protocol = "http"
  timeout = "5s"

[checks]
  [checks.health]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/health"
    port = 8080
    protocol = "http"
    timeout = "5s"
    type = "http"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

# Scaling configuration
[deploy]
  strategy = "rolling"
