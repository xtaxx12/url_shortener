# ============================================
# NGINX Configuration for Load Balancing
# ============================================
# This configuration provides:
# - Round Robin load balancing between Go replicas
# - Reverse proxy for API and frontend
# - Health checks for upstream servers
# - Optimized performance settings

# Worker processes (auto = number of CPU cores)
worker_processes auto;

# Error log configuration
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    # Maximum connections per worker
    worker_connections 4096;
    
    # Enable efficient connection processing
    use epoll;
    multi_accept on;
}

http {
    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/rss+xml application/atom+xml image/svg+xml;

    # Rate limiting zone (100 requests per second per IP)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;

    # ============================================
    # Upstream: Go API Replicas (Load Balancing)
    # ============================================
    upstream api_backend {
        # Load balancing method: Round Robin (default)
        # Alternative methods:
        #   least_conn;  - send to server with fewest connections
        #   ip_hash;     - session persistence based on client IP
        
        # Health check configuration
        # Note: Active health checks require NGINX Plus
        # Passive health checks are used here
        
        server api-1:8080 weight=1 max_fails=3 fail_timeout=30s;
        server api-2:8080 weight=1 max_fails=3 fail_timeout=30s;
        
        # Connection pooling
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    # ============================================
    # Main Server Block
    # ============================================
    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ============================================
        # Frontend (React app)
        # ============================================
        location / {
            proxy_pass http://frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ============================================
        # API Routes (Load Balanced)
        # ============================================
        location /api/ {
            # Apply rate limiting
            limit_req zone=api_limit burst=20 nodelay;
            
            # Proxy to upstream
            proxy_pass http://api_backend/api/;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Connection reuse
            proxy_set_header Connection "";
            
            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Buffer settings
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # ============================================
        # Short URL Redirects (Load Balanced)
        # ============================================
        # Match short codes pattern: /s/CODE
        location /s/ {
            # Rewrite to remove /s/ prefix and proxy to API
            rewrite ^/s/(.+)$ /$1 break;
            
            # Proxy to upstream for redirect handling
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Don't buffer redirects
            proxy_buffering off;
            
            # Fast timeout for redirects
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # ============================================
        # Health Check Endpoint
        # ============================================
        location /health {
            proxy_pass http://api_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # No logging for health checks
            access_log off;
        }

        # ============================================
        # NGINX Status (for monitoring)
        # ============================================
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;  # Docker networks
            deny all;
        }

        # Error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
