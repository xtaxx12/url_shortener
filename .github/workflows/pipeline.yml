# ============================================
# GitHub Actions CI/CD Pipeline
# ============================================
# This workflow:
# 1. Runs Go unit tests
# 2. Builds optimized Docker image
# 3. Verifies image size (<50MB)
# 4. Pushes to Docker Hub
# 5. Deploys to EC2 (or simulates deployment)

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  GO_VERSION: '1.21'
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/url-shortener-api
  IMAGE_SIZE_LIMIT_MB: 50

jobs:
  # ============================================
  # Job 1: Test
  # ============================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        working-directory: ./backend
        run: go mod download

      - name: Run unit tests
        working-directory: ./backend
        run: |
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.out

  # ============================================
  # Job 2: Build & Verify Docker Image
  # ============================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_size: ${{ steps.check_size.outputs.size }}
      image_size_ok: ${{ steps.check_size.outputs.size_ok }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check image size
        id: check_size
        run: |
          SIZE_BYTES=$(docker image inspect ${{ env.DOCKER_IMAGE }}:test --format='{{.Size}}')
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          echo "Image size: ${SIZE_MB}MB"
          echo "size=${SIZE_MB}" >> $GITHUB_OUTPUT
          
          if [ $SIZE_MB -lt ${{ env.IMAGE_SIZE_LIMIT_MB }} ]; then
            echo "✅ Image size is under ${IMAGE_SIZE_LIMIT_MB}MB limit"
            echo "size_ok=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Image size exceeds ${IMAGE_SIZE_LIMIT_MB}MB limit"
            echo "size_ok=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Display image details
        run: |
          echo "📦 Docker Image Details:"
          docker images ${{ env.DOCKER_IMAGE }}:test
          echo ""
          echo "📋 Image layers:"
          docker history ${{ env.DOCKER_IMAGE }}:test

  # ============================================
  # Job 3: Push to Docker Hub
  # ============================================
  push:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ============================================
  # Job 4: Deploy (Simulation for Portfolio)
  # ============================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: http://${{ secrets.EC2_HOST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Option A: Deploy via SSH (uncomment if EC2 is configured)
      # - name: Deploy to EC2
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.EC2_HOST }}
      #     username: ec2-user
      #     key: ${{ secrets.EC2_SSH_KEY }}
      #     script: |
      #       cd /opt/url-shortener
      #       docker compose pull
      #       docker compose up -d --remove-orphans
      #       docker system prune -f

      # Option B: Simulated deployment (for portfolio demonstration)
      - name: Simulate deployment
        run: |
          echo "🚀 Deployment Simulation"
          echo "========================"
          echo ""
          echo "📦 Image: ${{ env.DOCKER_IMAGE }}:latest"
          echo "🌍 Target: Production EC2 instance"
          echo ""
          echo "Deployment steps that would be executed:"
          echo "1. SSH into EC2 instance"
          echo "2. Pull latest Docker images"
          echo "3. Run docker-compose up -d"
          echo "4. Verify health checks"
          echo "5. Clean up old images"
          echo ""
          echo "✅ Deployment simulation complete!"

      - name: Create deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ env.DOCKER_IMAGE }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Image Size** | ${{ needs.build.outputs.image_size }}MB |" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | Production |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
